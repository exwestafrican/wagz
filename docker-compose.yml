services:
  app:
    container_name: envoye-nest-app
    image: exwestafrican/waggz:${IMAGE_TAG}
    restart: always
    ports:
      - '3001:3001'
    environment:
      - DB_HOST=postgres-db
      - UPLOAD_DIR=/src/uploads
    env_file:
      - .env
    volumes:
      # Host path : path inside the app container.
      # Nest writes to /src/uploads. Those bytes are stored in /var/lib/uploads
      # on the Lightsail system disk, so they remain after docker compose up
      # replaces the container.
      - /var/lib/uploads:/src/uploads
  nginx:
    container_name: envoye-nginx
    image: nginx:latest
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - app
