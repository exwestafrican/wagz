services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      NODE_ENV: test
      DOCKER_DB_URL: postgresql://postgres:postgres@postgres:5432/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_JWT_ISSUER_URL: http://127.0.0.1:54321/auth/v1
      SUPABASE_KEY: ci-smoke-dummy-key
      MONNIFY_BASE_URL: https://sandbox.monnify.com
      MONNIFY_API_KEY: MK_TEST_8HVYD8SJ24
      MONNIFY_SECRET_KEY: ZEPMYKY843KQ6PL2RGAN4UBFXTWTTB0X
      MONNIFY_CONTRACT_CODE: 1230062731
    depends_on:
      postgres:
        condition: service_healthy
